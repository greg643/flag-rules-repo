name: Offline rules validation
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest discover -s tests -v
      - run: python library.py check-all
# No provider credentials, pull_request_target, publication, or GSS access here.
